<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer ring — bold, ocean blue for light backgrounds -->
  <circle cx="52" cy="52" r="36" stroke="#0891B2" stroke-width="7.5"/>
  <!-- Heatmap rings — fine, consistent weight -->
  <circle cx="52" cy="52" r="24.12" stroke="#0891B2" stroke-opacity="0.25" stroke-width="0.88"/>
  <circle cx="52" cy="52" r="13.32" stroke="#0891B2" stroke-opacity="0.42" stroke-width="0.88"/>
  <!-- Anomaly detection ring -->
  <circle cx="58.84" cy="45.16" r="6.3" stroke="#0E7490" stroke-width="1.4"/>
  <!-- Anomaly dot -->
  <circle cx="58.84" cy="45.16" r="2.14" fill="#0891B2"/>
  <!-- Handle -->
  <rect x="77.452" y="75.452" width="20.874" height="7" rx="3.5" transform="rotate(45 77.452 75.452)" fill="#0891B2"/>
</svg>
